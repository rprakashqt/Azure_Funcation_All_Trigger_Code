name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Enterprise.AzureFunctions.sln

      - name: Build
        run: dotnet build Enterprise.AzureFunctions.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Enterprise.AzureFunctions.sln --configuration Release --no-build --collect:"XPlat Code Coverage"

      - name: Publish function artifact
        run: dotnet publish src/Enterprise.Functions/Enterprise.Functions.csproj --configuration Release --no-build --output publish/function

      - name: Upload function artifact
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-functions
          path: publish/function
